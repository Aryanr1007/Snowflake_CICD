name: Snowflake CI/CD Deploy

on:

  # =========================================================
  # DEV DEPLOYMENT
  # =========================================================

  push:
    branches:
      - DEV

  # =========================================================
  # DEV -> PROD PROMOTION REQUEST
  #
  # A DEV -> PROD PR must have a promotion label.
  #
  # promote-sourcing -> promote only SOURCING
  # promote-sca      -> promote only SCA
  # =========================================================

  pull_request:
    types:
      - opened
      - synchronize
      - labeled
      - unlabeled
    branches:
      - PROD


permissions:
  contents: write
  pull-requests: write


jobs:

    # =========================================================
  # 1. VALIDATE PROMOTION PR
  #
  # If a DEV -> PROD PR does not have a promotion label,
  # automatically close it.
  # =========================================================

  validate-promotion-pr:

    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'DEV' &&
      github.event.pull_request.base.ref == 'PROD' &&
      github.event.pull_request.state == 'open' &&
      (
        github.event.action == 'opened' ||
        github.event.action == 'synchronize' ||
        github.event.action == 'unlabeled'
      ) &&
      !contains(github.event.pull_request.labels.*.name, 'promote-sourcing') &&
      !contains(github.event.pull_request.labels.*.name, 'promote-sca')

    runs-on: ubuntu-latest

    steps:

      - name: Reject PR without promotion label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |

          echo "ERROR: No promotion label found."
          echo "Required label: promote-sourcing OR promote-sca"

          gh pr comment "$PR_NUMBER" \
            --repo "$GH_REPO" \
            --body "This DEV to PROD PR was automatically closed because no promotion label was provided. Add the promote-sourcing or promote-sca label when creating the promotion request."

          gh pr close "$PR_NUMBER" \
            --repo "$GH_REPO"

          echo "Original PR #$PR_NUMBER closed successfully."


  # =========================================================
  # 2. SELECTIVE PROMOTION
  #
  # This job runs ONLY when a promotion label is added.
  #
  # It does NOT run on every DEV update.
  # =========================================================

  promote-to-prod:

    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.pull_request.head.ref == 'DEV' &&
      github.event.pull_request.base.ref == 'PROD' &&
      github.event.pull_request.state == 'open' &&
      (
        github.event.label.name == 'promote-sourcing' ||
        github.event.label.name == 'promote-sca'
      )

    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # Checkout current PROD
      # -------------------------------------------------------

      - name: Checkout PROD
        uses: actions/checkout@v4
        with:
          ref: PROD
          fetch-depth: 0


      # -------------------------------------------------------
      # Configure Git
      # -------------------------------------------------------

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"


      # -------------------------------------------------------
      # Fetch DEV and PROD
      # -------------------------------------------------------

      - name: Fetch DEV and PROD
        run: |
          git fetch origin DEV
          git fetch origin PROD


      # -------------------------------------------------------
      # Determine selected project
      #
      # Only the label added by this event determines
      # what is being promoted.
      # -------------------------------------------------------

      - name: Determine selected project
        id: selection
        shell: bash
        env:
          LABEL: ${{ github.event.label.name }}
        run: |

          echo "Promotion label added: $LABEL"

          if [[ "$LABEL" == "promote-sourcing" ]]; then

            PROJECT="SOURCING"

          elif [[ "$LABEL" == "promote-sca" ]]; then

            PROJECT="SCA"

          else

            echo "Invalid promotion label: $LABEL"
            exit 1

          fi

          echo "Selected project: $PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"


      # -------------------------------------------------------
      # Create selective promotion branch
      #
      # Branch starts from current PROD.
      # -------------------------------------------------------

      - name: Create selective promotion branch
        id: branch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |

          BRANCH_NAME="promote/pr-${PR_NUMBER}"

          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

          # Reset/create local promotion branch from current PROD.
          git checkout -B "$BRANCH_NAME" origin/PROD


      # -------------------------------------------------------
      # Apply ONLY selected project changes
      #
      # Compare DEV PR base -> DEV PR head.
      # Only the selected project folder is extracted.
      # -------------------------------------------------------

      - name: Apply selected project changes
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROJECT: ${{ steps.selection.outputs.project }}
        run: |

          echo "---------------------------------------"
          echo "Selective Promotion"
          echo "---------------------------------------"

          echo "Base commit : $PR_BASE_SHA"
          echo "Head commit : $PR_HEAD_SHA"
          echo "Project     : $PROJECT"

          echo ""
          echo "Changes in DEV PR for selected project:"

          git diff \
            --name-status \
            "$PR_BASE_SHA" \
            "$PR_HEAD_SHA" \
            -- "projects/$PROJECT/"


          git diff \
            --binary \
            "$PR_BASE_SHA" \
            "$PR_HEAD_SHA" \
            -- "projects/$PROJECT/" \
            > "/tmp/${PROJECT}.patch"


          if [ ! -s "/tmp/${PROJECT}.patch" ]; then

            echo "ERROR: No changes found for selected project: $PROJECT"

            echo "The original DEV -> PROD PR will NOT be closed."

            exit 1

          fi


          echo ""
          echo "Applying selected project changes..."

          git apply \
            --3way \
            "/tmp/${PROJECT}.patch"


      # -------------------------------------------------------
      # Show staged promotion changes
      # -------------------------------------------------------

      - name: Show promoted changes
        run: |

          echo "======================================="
          echo "Changes that will be promoted to PROD"
          echo "======================================="

          echo ""
          echo "Git status:"

          git status --short

          echo ""
          echo "Staged files:"

          git diff --cached --name-status

          echo ""
          echo "Staged file count:"

          git diff --cached --name-only | wc -l


      # -------------------------------------------------------
      # Commit selective promotion
      #
      # git apply stages the selected changes, therefore
      # git diff --cached is used.
      # -------------------------------------------------------

      - name: Commit selective promotion
        id: commit-promotion
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROJECT: ${{ steps.selection.outputs.project }}
        run: |

          if git diff --cached --quiet; then

            echo "ERROR: No staged changes to promote."

            echo "The original DEV -> PROD PR will NOT be closed."

            exit 1

          fi


          echo "Committing selective promotion..."

          git commit \
            -m "Selective promotion of ${PROJECT} from DEV PR #${PR_NUMBER}"


      # -------------------------------------------------------
      # Push selective promotion branch
      # -------------------------------------------------------

      - name: Push promotion branch
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.BRANCH_NAME }}
        run: |

          echo "Pushing promotion branch: $BRANCH_NAME"

          git push \
            --force-with-lease \
            origin \
            "$BRANCH_NAME"


      # -------------------------------------------------------
      # Create Promotion PR
      #
      # IMPORTANT:
      # Original PR is NOT closed until this succeeds.
      # -------------------------------------------------------

      - name: Create promotion PR
        id: create-promotion-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.branch.outputs.BRANCH_NAME }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROJECT: ${{ steps.selection.outputs.project }}
        run: |

          echo "Checking for existing Promotion PR..."

          EXISTING_PR=$(gh pr list \
            --head "$BRANCH_NAME" \
            --base PROD \
            --state open \
            --json number \
            --jq '.[0].number')


          if [ -n "$EXISTING_PR" ]; then

            echo "Promotion PR already exists: #$EXISTING_PR"

            PROMOTION_PR="$EXISTING_PR"

          else

            echo "Creating Promotion PR..."

            PROMOTION_PR=$(gh pr create \
              --base PROD \
              --head "$BRANCH_NAME" \
              --title "Selective ${PROJECT} promotion from DEV PR #${PR_NUMBER}" \
              --body "This PR contains only the ${PROJECT} changes selected for promotion from DEV PR #${PR_NUMBER}." \
              --json number \
              --jq '.number')

            echo "Promotion PR created: #$PROMOTION_PR"

          fi


          if [ -z "$PROMOTION_PR" ]; then

            echo "ERROR: Promotion PR was not created."

            echo "The original DEV -> PROD PR will NOT be closed."

            exit 1

          fi


          echo "promotion_pr=$PROMOTION_PR" >> "$GITHUB_OUTPUT"


      # -------------------------------------------------------
      # Close original DEV -> PROD PR
      #
      # This happens ONLY after Promotion PR exists.
      # -------------------------------------------------------

      - name: Close original DEV to PROD PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORIGINAL_PR: ${{ github.event.pull_request.number }}
          PROMOTION_PR: ${{ steps.create-promotion-pr.outputs.promotion_pr }}
          PROJECT: ${{ steps.selection.outputs.project }}
        run: |

          if [ -z "$PROMOTION_PR" ]; then

            echo "ERROR: Promotion PR number is missing."

            echo "Original PR will remain open."

            exit 1

          fi


          echo "Promotion PR #$PROMOTION_PR exists."

          echo "Closing original DEV -> PROD PR #$ORIGINAL_PR"


          gh pr comment "$ORIGINAL_PR" \
            --body "Selective promotion for **${PROJECT}** has been created as PR #${PROMOTION_PR}. This original DEV → PROD PR is being automatically closed. Please review and merge the selective promotion PR."


          gh pr close "$ORIGINAL_PR"


          echo "Original DEV -> PROD PR #$ORIGINAL_PR closed successfully."


  # =========================================================
  # 3. DETECT DEV PROJECTS
  # =========================================================

  detect-dev-projects:

    if: github.event_name == 'push' && github.ref == 'refs/heads/DEV'

    runs-on: ubuntu-latest

    outputs:
      projects: ${{ steps.set-projects.outputs.projects }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Detect changed DEV projects
        id: set-projects
        shell: bash
        run: |

          PREV_COMMIT=$(git rev-parse HEAD~1)

          changed_files=$(git diff \
            --name-only \
            "$PREV_COMMIT" \
            HEAD \
            | grep '^projects/' \
            | grep '\.sql$' \
            || true)


          if [ -z "$changed_files" ]; then

            echo "No changed SQL files."

            echo "projects=[]" >> "$GITHUB_OUTPUT"

            exit 0

          fi


          echo "Changed files:"
          echo "$changed_files"


          projects=$(echo "$changed_files" \
            | awk -F/ '{print $2}' \
            | sort -u \
            | sed 's/$/_DEV/' \
            | jq -R -s -c 'split("\n")[:-1]')


          echo "Detected projects: $projects"

          echo "projects=$projects" >> "$GITHUB_OUTPUT"


  # =========================================================
  # 4. DEPLOY TO DEV
  # =========================================================

  deploy-dev:

    needs: detect-dev-projects

    if: >
      needs.detect-dev-projects.outputs.projects != '[]'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: ${{ fromJson(needs.detect-dev-projects.outputs.projects) }}

    env:
      PROJECT: ${{ matrix.project }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install snowflake-connector-python cryptography


      - name: Parse project config and save private key
        shell: bash
        run: |

          CONFIG_FILE=configs/config.json

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Config file not found: $CONFIG_FILE"
            exit 1
          fi


          KEY_PATH=$(jq -r \
            --arg key "$PROJECT" \
            '.[$key].key_path' \
            "$CONFIG_FILE")


          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"


          mkdir -p "$(dirname "$KEY_PATH")"


          echo "${{ secrets[format('{0}_PRIVATE_KEY', env.PROJECT)] }}" \
            | tr -d '\r' > "$KEY_PATH"


      - name: Deploy changed DEV files
        env:
          CONFIG_FILE: configs/config.json
          SNOWFLAKE_PRIVATE_KEY_PATH: ${{ env.KEY_PATH }}
        run: |

          BASE_PROJECT=$(echo "$PROJECT" | sed 's/_.*//')

          PREV_COMMIT=$(git rev-parse HEAD~1)


          changed_files=$(git diff \
            --name-only \
            "$PREV_COMMIT" \
            HEAD \
            | grep "^projects/${BASE_PROJECT}/" \
            | grep '\.sql$' \
            || true)


          if [ -z "$changed_files" ]; then

            echo "No changed SQL files."

            exit 0

          fi


          echo "Deploying changed files for project $BASE_PROJECT:"

          echo "$changed_files"


          python deploy_sql_files.py \
            --project "$PROJECT" \
            --files "$changed_files" \
            --config_file "$CONFIG_FILE" \
            --key_path "$SNOWFLAKE_PRIVATE_KEY_PATH"


  # =========================================================
  # 5. DETECT PROD PROJECTS
  # =========================================================

  detect-prod-projects:

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/PROD'

    runs-on: ubuntu-latest

    outputs:
      projects: ${{ steps.set-projects.outputs.projects }}

    steps:

      - name: Checkout PROD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Detect changed PROD projects
        id: set-projects
        shell: bash
        run: |

          PREV_COMMIT=$(git rev-parse HEAD~1)


          changed_files=$(git diff \
            --name-only \
            "$PREV_COMMIT" \
            HEAD \
            | grep '^projects/' \
            | grep '\.sql$' \
            || true)


          if [ -z "$changed_files" ]; then

            echo "No changed SQL files."

            echo "projects=[]" >> "$GITHUB_OUTPUT"

            exit 0

          fi


          echo "Changed PROD files:"

          echo "$changed_files"


          projects=$(echo "$changed_files" \
            | awk -F/ '{print $2}' \
            | sort -u \
            | sed 's/$/_PROD/' \
            | jq -R -s -c 'split("\n")[:-1]')


          echo "Detected PROD projects: $projects"

          echo "projects=$projects" >> "$GITHUB_OUTPUT"


  # =========================================================
  # 6. DEPLOY TO PROD
  # =========================================================

  deploy-prod:

    needs: detect-prod-projects

    if: >
      needs.detect-prod-projects.outputs.projects != '[]'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: ${{ fromJson(needs.detect-prod-projects.outputs.projects) }}

    env:
      PROJECT: ${{ matrix.project }}

    steps:

      - name: Checkout PROD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install snowflake-connector-python cryptography


      - name: Parse project config and save private key
        shell: bash
        run: |

          CONFIG_FILE=configs/config.json

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Config file not found: $CONFIG_FILE"
            exit 1
          fi


          KEY_PATH=$(jq -r \
            --arg key "$PROJECT" \
            '.[$key].key_path' \
            "$CONFIG_FILE")


          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"


          mkdir -p "$(dirname "$KEY_PATH")"


          echo "${{ secrets[format('{0}_PRIVATE_KEY', env.PROJECT)] }}" \
            | tr -d '\r' > "$KEY_PATH"


      - name: Deploy changed PROD files
        env:
          CONFIG_FILE: configs/config.json
          SNOWFLAKE_PRIVATE_KEY_PATH: ${{ env.KEY_PATH }}
        run: |

          BASE_PROJECT=$(echo "$PROJECT" | sed 's/_.*//')

          PREV_COMMIT=$(git rev-parse HEAD~1)


          changed_files=$(git diff \
            --name-only \
            "$PREV_COMMIT" \
            HEAD \
            | grep "^projects/${BASE_PROJECT}/" \
            | grep '\.sql$' \
            || true)


          if [ -z "$changed_files" ]; then

            echo "No changed SQL files."

            exit 0

          fi


          echo "Deploying changed PROD files for project $BASE_PROJECT:"

          echo "$changed_files"


          python deploy_sql_files.py \
            --project "$PROJECT" \
            --files "$changed_files" \
            --config_file "$CONFIG_FILE" \
            --key_path "$SNOWFLAKE_PRIVATE_KEY_PATH"
