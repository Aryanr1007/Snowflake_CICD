name: Snowflake CI/CD Deploy

on:

  # =========================================================
  # DEV DEPLOYMENT
  # =========================================================

  push:
    branches:
      - DEV

  # =========================================================
  # DEV -> PROD PROMOTION REQUEST
  #
  # The DEV -> PROD PR is only used as a promotion request.
  # It does NOT need to be mergeable.
  #
  # promote-sourcing -> promote only SOURCING
  # promote-sca      -> promote only SCA
  # =========================================================

  pull_request:
    types:
      - opened
      - synchronize
      - labeled
      - unlabeled
    branches:
      - PROD


permissions:
  contents: write
  pull-requests: write


jobs:

  # =========================================================
  # 1. VALIDATE PROMOTION PR
  #
  # This job only handles:
  #
  #   - No promotion label
  #   - Both promotion labels
  #
  # IMPORTANT:
  # It does NOT run when a valid promotion label is added.
  # =========================================================

  validate-promotion-pr:

    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'DEV' &&
      github.event.pull_request.base.ref == 'PROD' &&
      github.event.pull_request.state == 'open' &&
      (
        github.event.action == 'opened' ||
        github.event.action == 'synchronize' ||
        github.event.action == 'unlabeled'
      ) &&
      (
        (
          !contains(github.event.pull_request.labels.*.name, 'promote-sourcing') &&
          !contains(github.event.pull_request.labels.*.name, 'promote-sca')
        )
        ||
        (
          contains(github.event.pull_request.labels.*.name, 'promote-sourcing') &&
          contains(github.event.pull_request.labels.*.name, 'promote-sca')
        )
      )

    runs-on: ubuntu-latest

    steps:

      - name: Validate promotion label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |

          echo "PR labels: $LABELS"


          HAS_SOURCING=false
          HAS_SCA=false


          if [[ ",$LABELS," == *",promote-sourcing,"* ]]; then
            HAS_SOURCING=true
          fi


          if [[ ",$LABELS," == *",promote-sca,"* ]]; then
            HAS_SCA=true
          fi


          # ---------------------------------------------------
          # Both labels
          # ---------------------------------------------------

          if [[ "$HAS_SOURCING" == "true" && "$HAS_SCA" == "true" ]]; then

            MESSAGE="This DEV to PROD PR was automatically closed because both promotion labels were added. Please create a new PR and select exactly one label: promote-sourcing OR promote-sca."

          # ---------------------------------------------------
          # No labels
          # ---------------------------------------------------

          elif [[ "$HAS_SOURCING" == "false" && "$HAS_SCA" == "false" ]]; then

            MESSAGE="This DEV to PROD PR was automatically closed because no promotion label was provided. Please create a new PR and add exactly one label: promote-sourcing OR promote-sca."

          else

            echo "Exactly one valid promotion label exists."
            exit 0

          fi


          echo "$MESSAGE"


          gh pr comment "$PR_NUMBER" \
            --repo "$GH_REPO" \
            --body "$MESSAGE"


          gh pr close "$PR_NUMBER" \
            --repo "$GH_REPO"


          echo "Original PR #$PR_NUMBER closed."


  # =========================================================
  # 2. SELECTIVE PROMOTION
  #
  # IMPORTANT:
  #
  # This job runs ONLY when a promotion label is ADDED.
  #
  # It does NOT care whether the original DEV -> PROD PR
  # has a merge conflict.
  #
  # The Promotion PR is created independently from latest PROD.
  # =========================================================

  promote-to-prod:

    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.pull_request.head.ref == 'DEV' &&
      github.event.pull_request.base.ref == 'PROD' &&
      github.event.pull_request.state == 'open' &&
      (
        github.event.label.name == 'promote-sourcing' ||
        github.event.label.name == 'promote-sca'
      ) &&
      !(
        contains(github.event.pull_request.labels.*.name, 'promote-sourcing') &&
        contains(github.event.pull_request.labels.*.name, 'promote-sca')
      )

    runs-on: ubuntu-latest

    steps:

      # =======================================================
      # Checkout latest PROD
      # =======================================================

      - name: Checkout latest PROD
        uses: actions/checkout@v4
        with:
          ref: PROD
          fetch-depth: 0


      # =======================================================
      # Configure Git
      # =======================================================

      - name: Configure Git
        run: |

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"


      # =======================================================
      # Fetch DEV and PROD
      # =======================================================

      - name: Fetch DEV and PROD
        run: |

          git fetch origin DEV
          git fetch origin PROD


      # =======================================================
      # Determine selected project
      # =======================================================

      - name: Determine selected project
        id: selection
        shell: bash
        env:
          LABEL: ${{ github.event.label.name }}
        run: |

          echo "Promotion label: $LABEL"


          if [[ "$LABEL" == "promote-sourcing" ]]; then

            PROJECT="SOURCING"

          elif [[ "$LABEL" == "promote-sca" ]]; then

            PROJECT="SCA"

          else

            echo "ERROR: Invalid promotion label: $LABEL"
            exit 1

          fi


          echo "Selected project: $PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"


      # =======================================================
      # Create promotion branch FROM LATEST PROD
      #
      # This is critical.
      #
      # We do NOT create the branch from DEV.
      # =======================================================

      - name: Create selective promotion branch
        id: branch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |

          BRANCH_NAME="promote/pr-${PR_NUMBER}"


          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_OUTPUT"


          echo "Creating promotion branch from latest PROD..."


          git checkout -B "$BRANCH_NAME" origin/PROD


          echo "Promotion branch created from PROD."


      # =======================================================
      # Generate ONLY selected project changes
      #
      # PR_BASE_SHA = PROD version when original PR was created
      # PR_HEAD_SHA = current DEV version
      #
      # We filter by project folder.
      #
      # Therefore:
      #
      # promote-sourcing
      #   -> projects/SOURCING/*
      #
      # promote-sca
      #   -> projects/SCA/*
      #
      # SCA conflicts do not enter a SOURCING promotion.
      # =======================================================

      - name: Generate selected project patch
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROJECT: ${{ steps.selection.outputs.project }}
        run: |

          echo "======================================="
          echo "Selective Promotion"
          echo "======================================="


          echo "Original PR base SHA:"
          echo "$PR_BASE_SHA"


          echo "Original PR head SHA:"
          echo "$PR_HEAD_SHA"


          echo "Selected project:"
          echo "$PROJECT"


          echo ""
          echo "Changes for selected project between DEV and PR base:"


          git diff \
            --name-status \
            "$PR_BASE_SHA" \
            "$PR_HEAD_SHA" \
            -- "projects/$PROJECT/"


          # ---------------------------------------------------
          # Create binary patch containing ONLY selected folder
          # ---------------------------------------------------

          git diff \
            --binary \
            "$PR_BASE_SHA" \
            "$PR_HEAD_SHA" \
            -- "projects/$PROJECT/" \
            > "/tmp/${PROJECT}.patch"


          # ---------------------------------------------------
          # Verify patch exists
          # ---------------------------------------------------

          if [ ! -s "/tmp/${PROJECT}.patch" ]; then

            echo "ERROR: No changes found for $PROJECT."

            echo "The original DEV -> PROD PR will NOT be closed."

            exit 1

          fi


          echo ""
          echo "Patch created successfully."


          echo "Patch contents:"

          git diff \
            "$PR_BASE_SHA" \
            "$PR_HEAD_SHA" \
            -- "projects/$PROJECT/"


      # =======================================================
      # Apply selected patch to latest PROD
      # =======================================================

      - name: Apply selected project changes
        shell: bash
        env:
          PROJECT: ${{ steps.selection.outputs.project }}
        run: |

          echo "Applying ONLY $PROJECT changes to latest PROD..."


          git apply \
            --3way \
            "/tmp/${PROJECT}.patch"


          echo ""
          echo "Selected project changes applied."


      # =======================================================
      # Show exactly what will be promoted
      # =======================================================

      - name: Show promoted changes
        run: |

          echo "======================================="
          echo "Changes that will be promoted to PROD"
          echo "======================================="


          echo ""
          echo "Git status:"

          git status --short


          echo ""
          echo "Changed files:"

          git diff --name-status


          echo ""
          echo "Staged files:"

          git diff --cached --name-status


      # =======================================================
      # Commit selective promotion
      # =======================================================

      - name: Commit selective promotion
        id: commit-promotion
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROJECT: ${{ steps.selection.outputs.project }}
        run: |

          # ---------------------------------------------------
          # Check both staged and unstaged changes.
          #
          # git apply normally produces working-tree changes,
          # so stage them explicitly before committing.
          # ---------------------------------------------------

          if git diff --quiet && git diff --cached --quiet; then

            echo "ERROR: No changes to promote."

            echo "The original DEV -> PROD PR will NOT be closed."

            exit 1

          fi


          echo "Staging selected changes..."


          git add "projects/${PROJECT}/"


          if git diff --cached --quiet; then

            echo "ERROR: No staged changes after git add."

            echo "The original DEV -> PROD PR will NOT be closed."

            exit 1

          fi


          echo "Committing selective promotion..."


          git commit \
            -m "Selective promotion of ${PROJECT} from DEV PR #${PR_NUMBER}"


      # =======================================================
      # Push promotion branch
      # =======================================================

      - name: Push promotion branch
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.BRANCH_NAME }}
        run: |

          echo "Pushing promotion branch: $BRANCH_NAME"


          git push \
            --force-with-lease \
            origin \
            "$BRANCH_NAME"


          echo "Promotion branch pushed successfully."


      # =======================================================
      # Create Promotion PR
      #
      # IMPORTANT:
      #
      # We DO NOT care whether the original DEV -> PROD PR
      # has merge conflicts.
      #
      # This PR is created from:
      #
      # promote/pr-XX -> PROD
      # =======================================================

      - name: Create promotion PR
        id: create-promotion-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH_NAME: ${{ steps.branch.outputs.BRANCH_NAME }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROJECT: ${{ steps.selection.outputs.project }}
        run: |

          echo "Checking for existing Promotion PR..."


          EXISTING_PR=$(gh pr list \
            --repo "$GH_REPO" \
            --head "$BRANCH_NAME" \
            --base PROD \
            --state open \
            --json number \
            --jq '.[0].number')


          if [ -n "$EXISTING_PR" ]; then

            echo "Promotion PR already exists: #$EXISTING_PR"

            PROMOTION_PR="$EXISTING_PR"

          else

            echo "Creating Promotion PR..."


            PROMOTION_PR_URL=$(gh pr create \
              --repo "$GH_REPO" \
              --base PROD \
              --head "$BRANCH_NAME" \
              --title "Selective ${PROJECT} promotion from DEV PR #${PR_NUMBER}" \
              --body "This PR contains only the ${PROJECT} changes selected for promotion from DEV PR #${PR_NUMBER}."


            echo "Promotion PR URL: $PROMOTION_PR_URL"


            PROMOTION_PR=$(gh pr view \
              "$PROMOTION_PR_URL" \
              --repo "$GH_REPO" \
              --json number \
              --jq '.number')

          fi


          if [ -z "$PROMOTION_PR" ]; then

            echo "ERROR: Promotion PR number could not be determined."

            echo "The original DEV -> PROD PR will NOT be closed."

            exit 1

          fi


          echo "Promotion PR created/found: #$PROMOTION_PR"


          echo "promotion_pr=$PROMOTION_PR" >> "$GITHUB_OUTPUT"


      # =======================================================
      # Close original DEV -> PROD PR
      #
      # This is done ONLY after Promotion PR exists.
      #
      # It is okay if the original PR has a merge conflict.
      # =======================================================

      - name: Close original DEV to PROD PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ORIGINAL_PR: ${{ github.event.pull_request.number }}
          PROMOTION_PR: ${{ steps.create-promotion-pr.outputs.promotion_pr }}
          PROJECT: ${{ steps.selection.outputs.project }}
        run: |

          if [ -z "$PROMOTION_PR" ]; then

            echo "ERROR: Promotion PR number is missing."

            echo "Original DEV -> PROD PR will remain open."

            exit 1

          fi


          echo "Promotion PR #$PROMOTION_PR exists."


          echo "Closing original DEV -> PROD PR #$ORIGINAL_PR"


          gh pr comment "$ORIGINAL_PR" \
            --repo "$GH_REPO" \
            --body "Selective promotion for **${PROJECT}** has been created as PR #${PROMOTION_PR}. The original DEV to PROD PR may show merge conflicts because PROD contains independently promoted changes. This original PR is being automatically closed. Please review and merge the selective promotion PR."


          gh pr close "$ORIGINAL_PR" \
            --repo "$GH_REPO"


          echo "Original DEV -> PROD PR #$ORIGINAL_PR closed successfully."


  # =========================================================
  # 3. DETECT DEV PROJECTS
  # =========================================================

  detect-dev-projects:

    if: github.event_name == 'push' && github.ref == 'refs/heads/DEV'

    runs-on: ubuntu-latest

    outputs:
      projects: ${{ steps.set-projects.outputs.projects }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Detect changed DEV projects
        id: set-projects
        shell: bash
        run: |

          PREV_COMMIT=$(git rev-parse HEAD~1)


          changed_files=$(git diff \
            --name-only \
            "$PREV_COMMIT" \
            HEAD \
            | grep '^projects/' \
            | grep '\.sql$' \
            || true)


          if [ -z "$changed_files" ]; then

            echo "No changed SQL files."

            echo "projects=[]" >> "$GITHUB_OUTPUT"

            exit 0

          fi


          echo "Changed files:"
          echo "$changed_files"


          projects=$(echo "$changed_files" \
            | awk -F/ '{print $2}' \
            | sort -u \
            | sed 's/$/_DEV/' \
            | jq -R -s -c 'split("\n")[:-1]')


          echo "Detected projects: $projects"

          echo "projects=$projects" >> "$GITHUB_OUTPUT"


  # =========================================================
  # 4. DEPLOY TO DEV
  # =========================================================

  deploy-dev:

    needs: detect-dev-projects

    if: >
      needs.detect-dev-projects.outputs.projects != '[]'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: ${{ fromJson(needs.detect-dev-projects.outputs.projects) }}

    env:
      PROJECT: ${{ matrix.project }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install snowflake-connector-python cryptography


      - name: Parse project config and save private key
        shell: bash
        run: |

          CONFIG_FILE=configs/config.json


          if [ ! -f "$CONFIG_FILE" ]; then

            echo "Config file not found: $CONFIG_FILE"

            exit 1

          fi


          KEY_PATH=$(jq -r \
            --arg key "$PROJECT" \
            '.[$key].key_path' \
            "$CONFIG_FILE")


          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"


          mkdir -p "$(dirname "$KEY_PATH")"


          echo "${{ secrets[format('{0}_PRIVATE_KEY', env.PROJECT)] }}" \
            | tr -d '\r' > "$KEY_PATH"


      - name: Deploy changed DEV files
        env:
          CONFIG_FILE: configs/config.json
          SNOWFLAKE_PRIVATE_KEY_PATH: ${{ env.KEY_PATH }}
        run: |

          BASE_PROJECT=$(echo "$PROJECT" | sed 's/_.*//')


          PREV_COMMIT=$(git rev-parse HEAD~1)


          changed_files=$(git diff \
            --name-only \
            "$PREV_COMMIT" \
            HEAD \
            | grep "^projects/${BASE_PROJECT}/" \
            | grep '\.sql$' \
            || true)


          if [ -z "$changed_files" ]; then

            echo "No changed SQL files."

            exit 0

          fi


          echo "Deploying changed files for project $BASE_PROJECT:"

          echo "$changed_files"


          python deploy_sql_files.py \
            --project "$PROJECT" \
            --files "$changed_files" \
            --config_file "$CONFIG_FILE" \
            --key_path "$SNOWFLAKE_PRIVATE_KEY_PATH"


  # =========================================================
  # 5. DETECT PROD PROJECTS
  # =========================================================

  detect-prod-projects:

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/PROD'

    runs-on: ubuntu-latest

    outputs:
      projects: ${{ steps.set-projects.outputs.projects }}

    steps:

      - name: Checkout PROD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Detect changed PROD projects
        id: set-projects
        shell: bash
        run: |

          PREV_COMMIT=$(git rev-parse HEAD~1)


          changed_files=$(git diff \
            --name-only \
            "$PREV_COMMIT" \
            HEAD \
            | grep '^projects/' \
            | grep '\.sql$' \
            || true)


          if [ -z "$changed_files" ]; then

            echo "No changed SQL files."

            echo "projects=[]" >> "$GITHUB_OUTPUT"

            exit 0

          fi


          echo "Changed PROD files:"
          echo "$changed_files"


          projects=$(echo "$changed_files" \
            | awk -F/ '{print $2}' \
            | sort -u \
            | sed 's/$/_PROD/' \
            | jq -R -s -c 'split("\n")[:-1]')


          echo "Detected PROD projects: $projects"

          echo "projects=$projects" >> "$GITHUB_OUTPUT"


  # =========================================================
  # 6. DEPLOY TO PROD
  # =========================================================

  deploy-prod:

    needs: detect-prod-projects

    if: >
      needs.detect-prod-projects.outputs.projects != '[]'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: ${{ fromJson(needs.detect-prod-projects.outputs.projects) }}

    env:
      PROJECT: ${{ matrix.project }}

    steps:

      - name: Checkout PROD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install snowflake-connector-python cryptography


      - name: Parse project config and save private key
        shell: bash
        run: |

          CONFIG_FILE=configs/config.json


          if [ ! -f "$CONFIG_FILE" ]; then

            echo "Config file not found: $CONFIG_FILE"

            exit 1

          fi


          KEY_PATH=$(jq -r \
            --arg key "$PROJECT" \
            '.[$key].key_path' \
            "$CONFIG_FILE")


          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"


          mkdir -p "$(dirname "$KEY_PATH")"


          echo "${{ secrets[format('{0}_PRIVATE_KEY', env.PROJECT)] }}" \
            | tr -d '\r' > "$KEY_PATH"


      - name: Deploy changed PROD files
        env:
          CONFIG_FILE: configs/config.json
          SNOWFLAKE_PRIVATE_KEY_PATH: ${{ env.KEY_PATH }}
        run: |

          BASE_PROJECT=$(echo "$PROJECT" | sed 's/_.*//')


          PREV_COMMIT=$(git rev-parse HEAD~1)


          changed_files=$(git diff \
            --name-only \
            "$PREV_COMMIT" \
            HEAD \
            | grep "^projects/${BASE_PROJECT}/" \
            | grep '\.sql$' \
            || true)


          if [ -z "$changed_files" ]; then

            echo "No changed SQL files."

            exit 0

          fi


          echo "Deploying changed PROD files for project $BASE_PROJECT:"

          echo "$changed_files"


          python deploy_sql_files.py \
            --project "$PROJECT" \
            --files "$changed_files" \
            --config_file "$CONFIG_FILE" \
            --key_path "$SNOWFLAKE_PRIVATE_KEY_PATH"
