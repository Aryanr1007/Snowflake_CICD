name: Snowflake CI/CD Deploy

on:
  # ---------------------------------------------------------
  # DEV deployment
  # ---------------------------------------------------------
  push:
    branches:
      - DEV

  # ---------------------------------------------------------
  # DEV -> PROD promotion request
  # ---------------------------------------------------------
  pull_request:
    types:
      - opened
      - synchronize
      - labeled
    branches:
      - PROD


permissions:
  contents: write
  pull-requests: write


jobs:

  # =========================================================
  # 1. SELECTIVE PROMOTION
  # =========================================================

  promote-to-prod:

    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'DEV' &&
      github.event.pull_request.base.ref == 'PROD' &&
      github.event.pull_request.state == 'open' &&
      (
        contains(github.event.pull_request.labels.*.name, 'promote-sourcing') ||
        contains(github.event.pull_request.labels.*.name, 'promote-sca')
      )

    runs-on: ubuntu-latest

    steps:

      - name: Checkout PROD
        uses: actions/checkout@v4
        with:
          ref: PROD
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Fetch DEV and PROD
        run: |
          git fetch origin DEV
          git fetch origin PROD

      # -------------------------------------------------------
      # Determine which stream(s) should be promoted
      # -------------------------------------------------------

      - name: Determine selected projects
        id: selection
        shell: bash
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |

          echo "PR labels: $LABELS"

          PROJECTS=""

          if [[ "$LABELS" == *"promote-sourcing"* ]]; then
            PROJECTS="${PROJECTS} SOURCING"
          fi

          if [[ "$LABELS" == *"promote-sca"* ]]; then
            PROJECTS="${PROJECTS} SCA"
          fi

          if [ -z "$PROJECTS" ]; then
            echo "No valid promotion label found."
            exit 1
          fi

          echo "Selected projects:$PROJECTS"

          echo "projects=$PROJECTS" >> "$GITHUB_OUTPUT"


      # -------------------------------------------------------
      # Create / reset selective promotion branch from PROD
      # -------------------------------------------------------

      - name: Create selective promotion branch
        id: branch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |

          BRANCH_NAME="promote/pr-${PR_NUMBER}"

          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

          # Reset local promotion branch to current PROD
          git checkout -B "$BRANCH_NAME" origin/PROD


      # -------------------------------------------------------
      # Apply ONLY selected project changes from DEV PR
      # -------------------------------------------------------

      - name: Apply selected project changes
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROJECTS: ${{ steps.selection.outputs.projects }}
        run: |

          echo "Comparing:"
          echo "Base: $PR_BASE_SHA"
          echo "Head: $PR_HEAD_SHA"

          for PROJECT in $PROJECTS
          do

            echo "---------------------------------------"
            echo "Promoting project: $PROJECT"
            echo "---------------------------------------"

            git diff \
              --binary \
              "$PR_BASE_SHA" \
              "$PR_HEAD_SHA" \
              -- "projects/$PROJECT/" \
              > "/tmp/${PROJECT}.patch"

            if [ ! -s "/tmp/${PROJECT}.patch" ]; then
              echo "No changes found for $PROJECT"
              continue
            fi

            git apply \
              --3way \
              "/tmp/${PROJECT}.patch"

          done


      # -------------------------------------------------------
      # Show staged promotion changes
      # -------------------------------------------------------

      - name: Show promoted changes
        run: |

          echo "Changes that will be promoted to PROD:"

          git status --short

          echo ""
          echo "Staged files:"

          git diff --cached --name-only


      # -------------------------------------------------------
      # Commit selective promotion
      # -------------------------------------------------------

      - name: Commit selective promotion
        id: commit-promotion
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |

          if git diff --cached --quiet; then
            echo "ERROR: No staged changes to promote."
            echo "The original DEV -> PROD PR will NOT be closed."
            exit 1
          fi

          echo "Committing selective promotion..."

          git commit \
            -m "Selective promotion from DEV PR #${PR_NUMBER}"


      # -------------------------------------------------------
      # Push selective promotion branch
      # -------------------------------------------------------

      - name: Push promotion branch
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.BRANCH_NAME }}
        run: |

          git push \
            --force-with-lease \
            origin \
            "$BRANCH_NAME"


      # -------------------------------------------------------
      # Create promotion PR
      # -------------------------------------------------------

      - name: Create promotion PR
        id: create-promotion-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.branch.outputs.BRANCH_NAME }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |

          EXISTING_PR=$(gh pr list \
            --head "$BRANCH_NAME" \
            --base PROD \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then

            echo "Promotion PR already exists: #$EXISTING_PR"

            echo "promotion_pr=$EXISTING_PR" >> "$GITHUB_OUTPUT"

          else

            PROMOTION_PR=$(gh pr create \
              --base PROD \
              --head "$BRANCH_NAME" \
              --title "Selective promotion from DEV PR #${PR_NUMBER}" \
              --body "This PR contains only the explicitly selected stream changes from DEV PR #${PR_NUMBER}." \
              --json number \
              --jq '.number')

            echo "Created promotion PR: #$PROMOTION_PR"

            echo "promotion_pr=$PROMOTION_PR" >> "$GITHUB_OUTPUT"

          fi


      # -------------------------------------------------------
      # Close original DEV -> PROD PR
      #
      # This happens ONLY after the promotion PR exists.
      # -------------------------------------------------------

      - name: Close original DEV to PROD PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORIGINAL_PR: ${{ github.event.pull_request.number }}
          PROMOTION_PR: ${{ steps.create-promotion-pr.outputs.promotion_pr }}
        run: |

          if [ -z "$PROMOTION_PR" ]; then
            echo "Promotion PR number not available."
            echo "Original PR will remain open."
            exit 1
          fi

          echo "Promotion PR created: #$PROMOTION_PR"
          echo "Closing original DEV -> PROD PR: #$ORIGINAL_PR"

          gh pr comment "$ORIGINAL_PR" \
            --body "This PR has been automatically closed because selective promotion PR #$PROMOTION_PR was created. Please review and merge the selective promotion PR instead."

          gh pr close "$ORIGINAL_PR"

          echo "Original DEV -> PROD PR #$ORIGINAL_PR closed successfully."


  # =========================================================
  # 2. NORMAL DEV DEPLOYMENT
  # =========================================================

  detect-dev-projects:

    if: github.event_name == 'push' && github.ref == 'refs/heads/DEV'

    runs-on: ubuntu-latest

    outputs:
      projects: ${{ steps.set-projects.outputs.projects }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed DEV projects
        id: set-projects
        shell: bash
        run: |

          PREV_COMMIT=$(git rev-parse HEAD~1)

          changed_files=$(git diff \
            --name-only \
            "$PREV_COMMIT" \
            HEAD \
            | grep '^projects/' \
            | grep '\.sql$' \
            || true)

          if [ -z "$changed_files" ]; then

            echo "No changed SQL files."

            echo "projects=[]" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          echo "Changed files:"
          echo "$changed_files"

          projects=$(echo "$changed_files" \
            | awk -F/ '{print $2}' \
            | sort -u \
            | sed 's/$/_DEV/' \
            | jq -R -s -c 'split("\n")[:-1]')

          echo "Detected projects: $projects"

          echo "projects=$projects" >> "$GITHUB_OUTPUT"


  # =========================================================
  # 3. DEPLOY TO DEV
  # =========================================================

  deploy-dev:

    needs: detect-dev-projects

    if: >
      needs.detect-dev-projects.outputs.projects != '[]'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: ${{ fromJson(needs.detect-dev-projects.outputs.projects) }}

    env:
      PROJECT: ${{ matrix.project }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install snowflake-connector-python cryptography

      - name: Parse project config and save private key
        shell: bash
        run: |

          CONFIG_FILE=configs/config.json

          KEY_PATH=$(jq -r \
            --arg key "$PROJECT" \
            '.[$key].key_path' \
            "$CONFIG_FILE")

          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

          mkdir -p "$(dirname "$KEY_PATH")"

          echo "${{ secrets[format('{0}_PRIVATE_KEY', env.PROJECT)] }}" \
            | tr -d '\r' > "$KEY_PATH"

      - name: Deploy changed DEV files
        env:
          CONFIG_FILE: configs/config.json
          SNOWFLAKE_PRIVATE_KEY_PATH: ${{ env.KEY_PATH }}
        run: |

          BASE_PROJECT=$(echo "$PROJECT" | sed 's/_.*//')

          PREV_COMMIT=$(git rev-parse HEAD~1)

          changed_files=$(git diff \
            --name-only \
            "$PREV_COMMIT" \
            HEAD \
            | grep "^projects/${BASE_PROJECT}/" \
            | grep '\.sql$' \
            || true)

          if [ -z "$changed_files" ]; then
            echo "No changed SQL files."
            exit 0
          fi

          echo "$changed_files"

          python deploy_sql_files.py \
            --project "$PROJECT" \
            --files "$changed_files" \
            --config_file "$CONFIG_FILE" \
            --key_path "$SNOWFLAKE_PRIVATE_KEY_PATH"


  # =========================================================
  # 4. PROD DEPLOYMENT
  #
  # Runs only after selective promotion PR is merged.
  # =========================================================

  detect-prod-projects:

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/PROD'

    runs-on: ubuntu-latest

    outputs:
      projects: ${{ steps.set-projects.outputs.projects }}

    steps:

      - name: Checkout PROD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed PROD projects
        id: set-projects
        shell: bash
        run: |

          PREV_COMMIT=$(git rev-parse HEAD~1)

          changed_files=$(git diff \
            --name-only \
            "$PREV_COMMIT" \
            HEAD \
            | grep '^projects/' \
            | grep '\.sql$' \
            || true)

          if [ -z "$changed_files" ]; then

            echo "No changed SQL files."

            echo "projects=[]" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          echo "Changed PROD files:"
          echo "$changed_files"

          projects=$(echo "$changed_files" \
            | awk -F/ '{print $2}' \
            | sort -u \
            | sed 's/$/_PROD/' \
            | jq -R -s -c 'split("\n")[:-1]')

          echo "Detected PROD projects: $projects"

          echo "projects=$projects" >> "$GITHUB_OUTPUT"


  # =========================================================
  # 5. DEPLOY TO PROD
  # =========================================================

  deploy-prod:

    needs: detect-prod-projects

    if: >
      needs.detect-prod-projects.outputs.projects != '[]'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: ${{ fromJson(needs.detect-prod-projects.outputs.projects) }}

    env:
      PROJECT: ${{ matrix.project }}

    steps:

      - name: Checkout PROD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install snowflake-connector-python cryptography

      - name: Parse project config and save private key
        shell: bash
        run: |

          CONFIG_FILE=configs/config.json

          KEY_PATH=$(jq -r \
            --arg key "$PROJECT" \
            '.[$key].key_path' \
            "$CONFIG_FILE")

          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

          mkdir -p "$(dirname "$KEY_PATH")"

          echo "${{ secrets[format('{0}_PRIVATE_KEY', env.PROJECT)] }}" \
            | tr -d '\r' > "$KEY_PATH"

      - name: Deploy changed PROD files
        env:
          CONFIG_FILE: configs/config.json
          SNOWFLAKE_PRIVATE_KEY_PATH: ${{ env.KEY_PATH }}
        run: |

          BASE_PROJECT=$(echo "$PROJECT" | sed 's/_.*//')

          PREV_COMMIT=$(git rev-parse HEAD~1)

          changed_files=$(git diff \
            --name-only \
            "$PREV_COMMIT" \
            HEAD \
            | grep "^projects/${BASE_PROJECT}/" \
            | grep '\.sql$' \
            || true)

          if [ -z "$changed_files" ]; then
            echo "No changed SQL files."
            exit 0
          fi

          echo "$changed_files"

          python deploy_sql_files.py \
            --project "$PROJECT" \
            --files "$changed_files" \
            --config_file "$CONFIG_FILE" \
            --key_path "$SNOWFLAKE_PRIVATE_KEY_PATH"
